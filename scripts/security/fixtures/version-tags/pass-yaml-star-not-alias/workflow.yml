name: Star not alias
# *note
on:
  push:
    branches:
      - release/**
    tags: ['[0-9]+.[0-9]+.[0-9]+'] # *note
  schedule:
    - cron: '*/5 * * * *'
jobs:
  v:
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'v*'
      - run: echo "**"
      - run: echo *.txt
      - run: |
          echo *foo
          case "$x" in
            *dependabot*) echo bot ;;
            *) echo other ;;
          esac
