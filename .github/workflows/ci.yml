name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  COREPACK_ENABLE: "0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Run security checks
        run: ./scripts/security/security-checks.sh

      # ShellCheck and yamllint are preinstalled on GitHub's ubuntu-24.04
      # runner image; nothing is downloaded or installed at CI time.
      - name: Lint shell scripts
        run: ./scripts/lint-shell.sh

      - name: Lint YAML
        run: ./scripts/lint-yaml.sh

      - name: Install dependencies
        run: ./yarn install --immutable

      - name: Lint with Biome
        run: ./yarn lint

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Run security checks
        run: ./scripts/security/security-checks.sh

      - name: Install dependencies
        run: ./yarn install --immutable

      - name: Build site
        run: ./yarn build
