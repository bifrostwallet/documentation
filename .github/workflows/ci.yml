name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  COREPACK_ENABLE: "0"

jobs:
  lint-and-build:
    name: Lint and Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The parent commit, for "Check workflow tag rules" below.
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Run security checks
        run: ./scripts/security/security-checks.sh

      # Runs the check when this change touches .github/ or the check itself,
      # and says so when it skips.
      - name: Check workflow tag rules
        run: ./scripts/security/verify-version-tags-if-changed.sh

      # ShellCheck and yamllint are preinstalled on GitHub's ubuntu-24.04
      # runner image; nothing is downloaded or installed at CI time.
      - name: Lint shell scripts
        run: ./scripts/lint-shell.sh

      - name: Lint YAML
        run: ./scripts/lint-yaml.sh

      # Every comment is in scripts/comments-baseline.txt. That file is under
      # CODEOWNERS, so a longer one needs owner review.
      - name: Check for new comments
        run: ./scripts/lint-comments.sh

      - name: Install dependencies
        run: ./yarn install --immutable

      # The install rewrote .pnp.cjs / .pnp.loader.mjs from yarn.lock. Any
      # difference from the commit means the committed loaders are not what
      # Yarn generates (they run on every ./yarn run, and nobody reviews them).
      - name: Verify committed PnP files match the install
        run: ./scripts/security/verify-pnp-files.sh

      - name: Lint with Biome
        run: ./yarn lint

      - name: Build site
        run: ./yarn build
