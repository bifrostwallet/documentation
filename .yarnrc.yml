approvedGitRepositories: []

cacheFolder: ./.yarn/cache

compressionLevel: 0

defaultSemverRangePrefix: ""

enableGlobalCache: false

enableHardenedMode: true

enableImmutableCache: true

enableImmutableInstalls: true

enableInlineBuilds: true

enableProgressBars: true

enableScripts: false

enableStrictSsl: true

enableTelemetry: false

nodeLinker: pnp

npmMinimalAgeGate: 30d

# Patched releases newer than npmMinimalAgeGate. Each descriptor is the
# minimum version that clears the current advisory and is still inside the
# parent's semver range, except qs and serialize-javascript which also need
# resolutions because their parents cap below the fix.
npmPreapprovedPackages:
  - body-parser@1.20.9
  - fast-uri@3.1.9
  - follow-redirects@1.16.2
  - joi@17.13.9
  - postcss-selector-parser@6.1.5
  - qs@6.16.1
  - serialize-javascript@7.1.3
  - undici@6.29.1

supportedArchitectures:
  cpu:
    - arm64
    - x64
  libc:
    - glibc
  os:
    - darwin
    - linux

yarnPath: .yarn/releases/yarn-4.18.1.cjs
